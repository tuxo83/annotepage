     install.html was the address for a year of links, bookmarks and one line
     in the roadmap. The page it named is how-to-install-it.html now, after
     the landing page's own chapter rather than after a word invented for it
     -- "how to" and not "how you", because that is the phrase people type.

     refresh with a link under it -- for whoever arrives with JavaScript off,
     with the refresh disabled, or on a crawler that reads the canonical
     instead.

     It carries no header, no menu and no stylesheet on purpose: nothing here
     is meant to be read for longer than it takes to leave, and a page nobody
     sees should not be a page anybody has to keep in step. tools/check-shell
     knows it by its refresh and leaves it out of the frame comparison. -->
