<!-- THIS PAGE IS A REDIRECT, AND IT IS ALL THAT GITHUB PAGES OFFERS.

     example-session.html said what the page contained; it never said whose
     long form it was. The two detail pages are named after the two chapters
     of the landing page now -- how-to-use-it.html and how-to-install-it.html
     -- so the address itself says which one it unfolds. "how to" and not
     "how you", because that is the phrase people type and search for.

     A static host has no 301 to give, so the redirect is a meta refresh with
     a link under it, for whoever arrives with JavaScript off, with the
     refresh disabled, or on a crawler that reads the canonical instead.

     PUT BACK ON 2026-09-05, AND THE REASON IS MEASURED THIS TIME. These two
     were deleted the same day they were written, on the argument that the site
     had not been public long enough for a single old link to exist. That was
     true of links and false of crawlers: the search engine had already indexed
     the old addresses, and deleting the redirect turned an indexed URL into a
     404. Nothing but the forward: no content, no header, no menu.

     It carries no header, no menu and no stylesheet on purpose: nothing here
     is meant to be read for longer than it takes to leave, and a page nobody
     sees should not be a page anybody has to keep in step. tools/check-shell
     knows it by its refresh and leaves it out of the frame comparison. -->
<meta http-equiv="refresh" content="0; url=how-to-use-it.html">
<link rel="canonical" href="https://annotepage.com/how-to-use-it.html">
<meta name="robots" content="noindex, follow">
</head>
<body>
<p><a href="how-to-use-it.html">This page moved to how-to-use-it.html</a></p>
</body>
