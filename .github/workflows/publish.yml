# ============================================================================
# publish.yml -- releasing the two npm packages, with no token at all.
#
# HOW A RELEASE HAPPENS: push to main. That is the whole procedure.
#
#     node tools/release.mjs client 2.0.1
#     npm run check
#     git commit -am "Release client 2.0.1" && git push
#
# On every push to main this workflow looks at each package's declared version
# and asks the registry whether it is already online. If it is -- which is the
# case on almost every push -- it publishes nothing and comes out green. If it
# is not, it builds, tests, and publishes that one.
#
# WHY VERSION-DRIVEN AND NOT TAG-DRIVEN. Two packages live in this repository,
# so a bare "v2.0.1" tag would not say which one moves, and a scheme of two tag
# prefixes is one more thing to remember correctly at the exact moment one is
# least careful. package.json already carries the version; making it the single
# source of truth removes the possibility of the two disagreeing.
#
# The safety is not the tag, it is the question put to the registry: a version
# already online is never republished, and every check below runs before
# anything goes out.
#
# BEFORE THE FIRST AUTOMATIC RUN, on npmjs.com, for EACH of the two packages:
# Settings > Trusted publishing > GitHub Actions, with tuxo83 / annotepage /
# publish.yml, filename exactly. Without it the OIDC exchange is refused, and
# the refusal reads "unable to authenticate", which explains nothing.
# ============================================================================

name: publish

on:
  push:
    branches:
      # main is what users get. `next` is where a version is validated before
      # they do: a version carrying a `-` publishes under npm's `next`
      # dist-tag, so `annotepage-client@2` -- the range every install uses --
      # keeps resolving to the last stable one, and only somebody asking for
      # `@next` gets the candidate. jsDelivr resolves dist-tags, checked
      # against a package that publishes both.
      #
      # THE BRANCH IS NAMED AFTER THE TAG IT PUBLISHES TO. It was `recette`
      # first, which is the ordinary word for this in French and the only
      # French word anywhere in this repository -- and it would have needed
      # translating in somebody's head every time. Pushing to `next` publishes
      # under `next`: there is nothing to map. `staging` was the other
      # candidate and it is already taken here: staging.example.com is the site
      # being reviewed, in every example on the site.
      #
      # The whole gate runs on both: a candidate nobody can install by accident
      # is still a candidate that has to pass everything.
      - main
      - next
  # Kept so a release can be forced by hand when the registry was unreachable
  # at the time of the push.
  workflow_dispatch:

# The only "secret" in this chain is that OIDC token, generated on demand,
# valid for a few minutes, tied to this repository and to this file. Nothing is
# stored, so nothing leaks and nothing has to be rotated by hand.
permissions:
  id-token: write
  contents: read

jobs:
  # NOTHING IS PUBLISHED UNTIL THE WHOLE REPOSITORY PASSES.
  #
  # The publish jobs below run `npm test` in the package's own directory, and
  # `prepublishOnly` runs it again -- so npm itself refuses a package whose own
  # tests fail. That was the whole gate, and it is not enough: the checks that
  # caught the worst of this project's mistakes are none of them a package's
  # own. The SRI digests written across six files, the built bundle actually
  # being parseable JavaScript, the four menus agreeing, the three version
  # numbers agreeing, the server manifest, the landing page's generator against
  # the MCP's -- all of them live at the root, and a package could go out with
  # every one of them failing.
  #
  # It happened. A release was pushed with `npm run check` failing, and the one
  # after it shipped a bundle the browser refuses to parse. A local hook now
  # refuses both, but a hook is on one machine and is skipped by --no-verify.
  # This is the same refusal, where nobody can walk past it.
  gate:
    name: the whole suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      # No dependencies to install: nothing in this repository has any. `npm
      # ci` would want a lock file that does not need to exist.
      - name: npm run check
        run: npm run check

  publish:
    needs: gate
    strategy:
      # Never fail-fast: if the client cannot go out, that is no reason for the
      # mcp to stay behind. They are two packages, not two halves of one.
      fail-fast: false
      matrix:
        include:
          - package: annotepage-client
            directory: client
          - package: annotepage-mcp
            directory: mcp

    name: ${{ matrix.package }}

    # Inside the job, not at workflow level: `matrix` does not exist up there,
    # and referring to it makes GitHub refuse to read the file at all -- the run
    # then appears under the file's PATH instead of its name, which is the only
    # clue you get. Two pushes must not cross in the registry for the SAME
    # package; the two packages may go out at once.
    concurrency:
      group: publish-${{ matrix.package }}
      cancel-in-progress: false
    # GitHub-hosted runner: trusted publishing refuses self-hosted runners, it
    # would not know who it is talking to.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # A dependency cache in a build that goes online publishes what was
          # lying in the cache, not what is in the tag. npm's recommendation,
          # followed as it stands.
          package-manager-cache: false

      - name: Check the versions trusted publishing requires
        run: |
          set -eu
          # We check instead of assuming, because the assumption is wrong one
          # time in two: 24.x shipped npm 11.3.0 then 11.4.2 before reaching
          # 11.5.1, and 22.x is still on npm 10. The day setup-node resolves
          # "24" onto one of those, the OIDC exchange fails with an
          # authentication message that sends you looking for a token that does
          # not exist. Better to fall over here, naming the cause.
          node_v="$(node -p 'process.versions.node')"
          npm_v="$(npm -v)"
          echo "node ${node_v} / npm ${npm_v}"
          at_least() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          at_least "${node_v}" 22.14.0 || { echo "::error::node ${node_v}: trusted publishing requires 22.14.0 at least"; exit 1; }
          at_least "${npm_v}" 11.5.1  || { echo "::error::npm ${npm_v}: trusted publishing requires 11.5.1 at least"; exit 1; }

      - name: Read the manifest, and decide whether there is anything to publish
        id: target
        run: |
          set -eu
          directory="${{ matrix.directory }}"
          name="${{ matrix.package }}"
          manifest="${directory}/package.json"
          [ -f "${manifest}" ] || { echo "::error::${manifest} is missing"; exit 1; }

          # The manifest is the single source of truth for the version. What it
          # declares is what goes online, and what is online is what it declares.
          declared_name="$(node -p "require('./${manifest}').name")"
          version="$(node -p "require('./${manifest}').version")"
          [ "${declared_name}" = "${name}" ] \
            || { echo "::error::${manifest} is called \"${declared_name}\"; this job publishes \"${name}\". The packages are UNSCOPED."; exit 1; }
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::${manifest} declares \"${version}\", which is not x.y.z"; exit 1 ;;
          esac

          # npm refuses a trusted publication whose repository.url does not
          # name exactly this repository. The refusal itself arrives at publish
          # time and does not name the cause: we name it here.
          repository="$(node -p "const r=require('./${manifest}').repository; (typeof r==='string'?r:(r&&r.url)||'')")"
          case "${repository}" in
            *"${GITHUB_REPOSITORY}"*) : ;;
            *) echo "::error::${manifest} must carry a repository field naming ${GITHUB_REPOSITORY} (found: \"${repository}\")"; exit 1 ;;
          esac

          # THE ONLY THING THAT DECIDES. Almost every push to main changes no
          # version, and the right outcome then is silence and a green tick: a
          # job that failed on every ordinary commit would be switched off
          # within a week, and would be off on the day it mattered.
          status=0
          output="$(npm view "${name}@${version}" version 2>&1)" || status=$?
          if [ "${status}" -eq 0 ] && [ -n "${output}" ]; then
            publish=no
            echo "::notice::${name}@${version} is already online: nothing to publish"
          elif [ "${status}" -eq 0 ] || printf '%s' "${output}" | grep -q 'E404'; then
            publish=yes
            echo "::notice::${name}@${version} is not online: publishing"
          else
            # Neither "published" nor "unknown": the registry did not answer.
            # We do not guess, or we would attempt a double publication.
            echo "::error::could not question the registry: ${output}"; exit 1
          fi

          {
            echo "directory=${directory}"
            echo "name=${name}"
            echo "version=${version}"
            echo "publish=${publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install the dependencies
        if: steps.target.outputs.publish == 'yes'
        working-directory: ${{ steps.target.outputs.directory }}
        run: |
          set -eu
          # npm ci requires a lock file, and the client has no dependencies so
          # not necessarily a lock file. An unconditional "npm ci" would fail on
          # the simpler of the two packages.
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Build and test before going online: a published version cannot be
      # withdrawn, it can only be replaced by the next one.
      - name: Build
        if: steps.target.outputs.publish == 'yes'
        working-directory: ${{ steps.target.outputs.directory }}
        run: npm run build --if-present

      - name: Test
        if: steps.target.outputs.publish == 'yes'
        working-directory: ${{ steps.target.outputs.directory }}
        run: npm test --if-present

      - name: Publish
        if: steps.target.outputs.publish == 'yes'
        working-directory: ${{ steps.target.outputs.directory }}
        # Without --provenance: public repository + trusted publishing, npm
        # generates the attestation by itself. Adding the flag would change
        # nothing and would suggest it is what produces it.
        run: |
          set -eu
          # THE DIST-TAG IS DERIVED FROM THE VERSION, NEVER ASSUMED.
          #
          # `npm publish` with no --tag moves `latest` -- including for a
          # pre-release. So publishing 2.17.0-rc.1 the plain way would make it
          # the version `npm install annotepage-client` hands to everybody,
          # which is the opposite of what a pre-release is for. npm does not
          # guess this; nobody's habit should have to either.
          #
          # A version carrying a `-` goes out under `next`. Nothing else moves:
          # `latest` stays where it was, the `@2` range keeps resolving to the
          # last stable one -- semver ranges exclude pre-releases -- and
          # `@next` is how the beta is asked for. jsDelivr resolves npm
          # dist-tags, verified against a package that publishes both.
          version="$(node -p "require('./package.json').version")"
          case "${version}" in
            *-*) echo "pre-release ${version}: publishing under the 'next' tag"
                 npm publish --tag next ;;
            *)   echo "release ${version}: publishing as 'latest'"
                 npm publish ;;
          esac

      # THE FLOATING TAG IS ONLY AS FAST AS THE CDN, and by default that is up
      # to twelve hours. jsDelivr resolves `@2` to a version and caches THAT
      # resolution at the edge with s-maxage=43200; a release published now is
      # invisible to every new visitor until it expires. Measured on 2.1.0: the
      # range still answered 2.0.1 for hours after publication.
      #
      # The project chose the floating tag precisely so that a fix reaches
      # sites whose owner has stopped thinking about the tool. Leaving half a
      # day between "published" and "served" is giving that back for nothing,
      # when one request closes it -- the purge endpoint answers
      # "status": "finished" for both providers, in seconds.
      #
      # It cannot make the file wrong: it asks the edge to fetch again from
      # npm, which is the only source either way. So it does not gate the job
      # -- if it fails, the release is still published and the range catches up
      # on its own, which is exactly what happens today.
      - name: Ask jsDelivr to fetch the new version now
        if: steps.target.outputs.publish == 'yes' && steps.target.outputs.name == 'annotepage-client'
        continue-on-error: true
        run: |
          set -u
          for path in \
            "npm/annotepage-client@2/dist/annotepage.js" \
            "npm/annotepage-client/dist/annotepage.js"; do
            echo "purging ${path}"
            curl -sS --max-time 30 "https://purge.jsdelivr.net/${path}" || true
            echo
          done

      - name: Summarise
        if: always()
        run: |
          set -eu
          {
            echo "## ${{ steps.target.outputs.name }} ${{ steps.target.outputs.version }}"
            if [ "${{ steps.target.outputs.publish }}" = "yes" ]; then
              echo "Published from \`${{ steps.target.outputs.directory }}/\` by OIDC token, with no stored token."
            else
              echo "Already online: nothing published."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  # ==========================================================================
  # THE WORDPRESS PLUGIN, on the same rule as the packages: the version written
  # in the file decides, and a version already online is never published again.
  # Push to main, and this goes out with the rest.
  #
  # IT IS INERT UNTIL THREE THINGS EXIST OUTSIDE THIS REPOSITORY, and it says
  # which one is missing rather than failing red. .github/workflows/README.md
  # lists them. This is not a control being loosened: there is no wordpress.org
  # repository to write to before a human at wordpress.org has approved the
  # plugin, and a job that failed on every push until that day is a job somebody
  # switches off and forgets.
  #
  # WHY A PASSWORD AND NOT A TOKEN. npm gave us trusted publishing, so the two
  # packages go out with no stored secret at all. wordpress.org has no such
  # thing: SVN authenticates with the account's own username and password, and
  # that account owns every plugin it publishes. That is the weakest link in
  # this file and it is worth knowing it is there.
  #
  # NOT ON `next`. There is one channel in the directory and it is what every
  # site updates to; a pre-release has nowhere to go. The gate still runs on
  # both branches.
  # ==========================================================================
  wordpress:
    needs: gate
    name: wordpress.org
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-wordpress
      cancel-in-progress: false
    env:
      SLUG: annotepage
      WPORG_USERNAME: ${{ secrets.WPORG_USERNAME }}
      WPORG_PASSWORD: ${{ secrets.WPORG_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Read the version, and decide whether there is anything to publish
        id: target
        run: |
          set -eu

          # The header is what WordPress installs by, and readme.txt's Stable
          # tag is what the DIRECTORY serves. They are compared here as well as
          # in `npm run check`, because this is the step that would publish the
          # disagreement to everybody who has the plugin installed.
          version="$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*//p' wordpress/annotepage.php | head -n 1 | tr -d '[:space:]')"
          stable="$(sed -n 's/^Stable tag:[[:space:]]*//p' wordpress/readme.txt | head -n 1 | tr -d '[:space:]')"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::the plugin header declares \"${version}\", which is not x.y.z"; exit 1 ;;
          esac
          [ "${version}" = "${stable}" ] \
            || { echo "::error::the plugin header says ${version} and readme.txt says Stable tag: ${stable}. The directory serves the readme's number."; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

          if [ -z "${WPORG_USERNAME}" ] || [ -z "${WPORG_PASSWORD}" ]; then
            echo "::notice::no wordpress.org credentials in this repository's secrets: nothing published"
            echo "publish=no" >> "${GITHUB_OUTPUT}"
            echo "why=no credentials configured" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # THE DIRECTORY IS ASKED, never assumed. An unanswered question is not
          # a "no": it publishes nothing and comes out green, the same way the
          # npm job refuses to guess when the registry is silent.
          answer="$(curl -sS --max-time 30 "https://api.wordpress.org/plugins/info/1.0/${SLUG}.json" || echo '')"
          if [ -z "${answer}" ] || [ "${answer}" = "null" ] || [ "${answer}" = "false" ]; then
            echo "::notice::${SLUG} is not in the plugin directory yet, so there is no repository to write to. Submit it once by hand; see .github/workflows/README.md"
            echo "publish=no" >> "${GITHUB_OUTPUT}"
            echo "why=not in the directory yet" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          online="$(printf '%s' "${answer}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(String(JSON.parse(s).version||""))}catch(e){process.stdout.write("")}})')"
          if [ "${online}" = "${version}" ]; then
            echo "::notice::${SLUG} ${version} is already online: nothing to publish"
            echo "publish=no" >> "${GITHUB_OUTPUT}"
            echo "why=already online" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::the directory serves ${online:-nothing}, this tree declares ${version}: publishing"
            echo "publish=yes" >> "${GITHUB_OUTPUT}"
            echo "why=publishing ${version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish to wordpress.org
        if: steps.target.outputs.publish == 'yes'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq subversion

          svn checkout --depth immediates "https://plugins.svn.wordpress.org/${SLUG}" svn
          svn update --set-depth infinity svn/trunk
          svn update --set-depth immediates svn/tags
          svn update --set-depth infinity svn/assets

          if [ -d "svn/tags/${VERSION}" ]; then
            echo "::error::tags/${VERSION} already exists in SVN. A published tag is never rewritten: bump the version."
            exit 1
          fi

          # WHAT SHIPS IS NOT WHAT IS IN THIS DIRECTORY. `tests/` is the harness
          # -- a stubbed WordPress that has no business on somebody's server --
          # and README.md is for whoever reads the code here; readme.txt is the
          # plugin's own page and does ship. assets/ goes to SVN's assets/, not
          # into the zip: that is where the directory looks for the icon, the
          # banner and the screenshots.
          #
          # `languages/` SHIPS, and is excluded by nothing on purpose. The .mo is
          # read from inside the plugin directory, so a trunk without it is an
          # English screen on a French site -- the one failure here that looks
          # like a decision rather than a defect. tools/check-wordpress.mjs holds
          # the same list for the zip the site hands out.
          rsync -a --delete \
            --exclude 'tests/' --exclude 'README.md' --exclude 'assets/' \
            wordpress/ svn/trunk/
          if [ -d wordpress/assets ]; then
            rsync -a --delete wordpress/assets/ svn/assets/
          fi

          cd svn
          # rsync removes a file; svn has to be told it is gone, or the next
          # commit silently keeps serving it.
          svn status | sed -n 's/^! *//p' | xargs -r -d '\n' svn delete -q --force
          svn add --force trunk assets --auto-props --parents --depth infinity -q
          svn cp trunk "tags/${VERSION}" -q

          svn commit -m "annotepage ${VERSION}" \
            --username "${WPORG_USERNAME}" --password "${WPORG_PASSWORD}" \
            --non-interactive --no-auth-cache

      - name: Summarise
        if: always()
        run: |
          set -eu
          {
            echo "## the WordPress plugin ${{ steps.target.outputs.version }}"
            echo "${{ steps.target.outputs.why }}"
          } >> "${GITHUB_STEP_SUMMARY}"
