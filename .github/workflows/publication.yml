# ============================================================================
# publication.yml — mise en ligne des deux paquets npm, sans aucun jeton.
#
# CONVENTION D'ETIQUETTE (elle est le seul declencheur, elle designe le paquet)
#
#     client-v<version>   ->  annotepage-client   (repertoire client/)
#     mcp-v<version>      ->  annotepage-mcp      (repertoire mcp/)
#
#     git tag client-v2.0.0 && git push origin client-v2.0.0
#
# Deux paquets vivent dans ce depot : une etiquette « v2.0.0 » seule ne dirait
# pas lequel mettre en ligne, et publier les deux a chaque etiquette
# republierait a coup sur une version deja en ligne — c'est-a-dire un echec a
# chaque fois qu'un seul des deux bouge.
#
# AVANT LA PREMIERE UTILISATION, cote npmjs.com, pour CHACUN des deux paquets :
# Settings > Trusted Publisher > GitHub Actions, avec le nom de ce fichier
# ecrit exactement — « publication.yml ». Le renommer casse la publication, et
# le refus se lit « unable to authenticate », qui n'explique rien.
# ============================================================================

name: publication

on:
  push:
    tags:
      - 'client-v*'
      - 'mcp-v*'

# Le seul « secret » de cette chaine est ce jeton OIDC, engendre a la demande,
# valable quelques minutes, lie a ce depot et a ce fichier. Rien n'est stocke,
# donc rien ne fuit ni ne se fait tourner a la main.
permissions:
  id-token: write
  contents: read

# Deux etiquettes poussees coup sur coup ne doivent pas se croiser dans le
# registre ; et on n'annule pas une publication en cours, elle n'est pas rejouable.
concurrency:
  group: publication-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publier:
    # Runner heberge par GitHub : la publication de confiance refuse les
    # runners auto-heberges, elle ne saurait pas a qui elle parle.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # Un cache de dependances dans une construction qui part en ligne
          # fait publier ce qui trainait dans le cache, pas ce qui est dans
          # l'etiquette. Recommandation npm, suivie telle quelle.
          package-manager-cache: false

      - name: Verifier les versions exigees par la publication de confiance
        run: |
          set -eu
          # On verifie au lieu de supposer, parce que la supposition est fausse
          # une fois sur deux : la 24.x a livre npm 11.3.0 puis 11.4.2 avant
          # d'atteindre 11.5.1, et la 22.x en est encore a npm 10. Le jour ou
          # setup-node resout « 24 » sur une de ces versions, l'echange OIDC
          # echoue avec un message d'authentification qui envoie chercher un
          # jeton absent. Mieux vaut tomber ici, en nommant la cause.
          node_v="$(node -p 'process.versions.node')"
          npm_v="$(npm -v)"
          echo "node ${node_v} / npm ${npm_v}"
          au_moins() { [ "$(printf '%s\n%s\n' "$2" "$1" | sort -V | head -n 1)" = "$2" ]; }
          au_moins "${node_v}" 22.14.0 || { echo "::error::node ${node_v} : la publication de confiance exige 22.14.0 au minimum"; exit 1; }
          au_moins "${npm_v}" 11.5.1  || { echo "::error::npm ${npm_v} : la publication de confiance exige 11.5.1 au minimum"; exit 1; }

      - name: Lire l'etiquette, et decider s'il y a quelque chose a publier
        id: cible
        run: |
          set -eu
          etiquette="${GITHUB_REF_NAME}"
          case "${etiquette}" in
            client-v*) repertoire=client; nom=annotepage-client; version="${etiquette#client-v}" ;;
            mcp-v*)    repertoire=mcp;    nom=annotepage-mcp;    version="${etiquette#mcp-v}" ;;
            *) echo "::error::etiquette « ${etiquette} » hors convention : client-v<version> ou mcp-v<version>"; exit 1 ;;
          esac

          manifeste="${repertoire}/package.json"
          [ -f "${manifeste}" ] || { echo "::error::${manifeste} est absent"; exit 1; }

          # L'etiquette annonce une version ; le manifeste en declare une. Si
          # les deux different, l'etiquette a ete posee sur le mauvais commit,
          # et ce qui partirait en ligne ne serait pas ce qu'on croit relire.
          nom_declare="$(node -p "require('./${manifeste}').name")"
          version_declaree="$(node -p "require('./${manifeste}').version")"
          [ "${nom_declare}" = "${nom}" ] \
            || { echo "::error::${manifeste} se nomme « ${nom_declare} » ; l'etiquette annonce « ${nom} ». Les paquets sont NON SCOPES."; exit 1; }
          [ "${version_declaree}" = "${version}" ] \
            || { echo "::error::${manifeste} declare ${version_declaree} ; l'etiquette annonce ${version}"; exit 1; }

          # npm refuse une publication de confiance dont repository.url ne
          # designe pas exactement ce depot. Le refus, lui, arrive au moment du
          # publish et ne nomme pas la cause : on la nomme ici.
          depot="$(node -p "const r=require('./${manifeste}').repository; (typeof r==='string'?r:(r&&r.url)||'')")"
          case "${depot}" in
            *"${GITHUB_REPOSITORY}"*) : ;;
            *) echo "::error::${manifeste} doit porter un champ repository designant ${GITHUB_REPOSITORY} (trouve : « ${depot} »)"; exit 1 ;;
          esac

          # Republier une version deja en ligne fait echouer le travail. Un
          # echec de routine finit par ne plus etre lu, et le jour ou il dit
          # quelque chose de vrai, personne ne le regarde : on saute, on
          # l'ecrit, et on sort vert.
          etat=0
          sortie="$(npm view "${nom}@${version}" version 2>&1)" || etat=$?
          if [ "${etat}" -eq 0 ] && [ -n "${sortie}" ]; then
            publier=non
            echo "::notice::${nom}@${version} est deja en ligne : rien a publier"
          elif [ "${etat}" -eq 0 ] || printf '%s' "${sortie}" | grep -q 'E404'; then
            publier=oui
          else
            # Ni « publiee » ni « inconnue » : le registre n'a pas repondu. On
            # ne devine pas, sans quoi on tenterait une publication en double.
            echo "::error::interrogation du registre impossible : ${sortie}"; exit 1
          fi

          {
            echo "repertoire=${repertoire}"
            echo "nom=${nom}"
            echo "version=${version}"
            echo "publier=${publier}"
          } >> "${GITHUB_OUTPUT}"

      - name: Installer les dependances
        if: steps.cible.outputs.publier == 'oui'
        working-directory: ${{ steps.cible.outputs.repertoire }}
        run: |
          set -eu
          # npm ci exige un verrou, et le client n'a aucune dependance donc pas
          # forcement de verrou. Un « npm ci » inconditionnel echouerait sur le
          # paquet le plus simple des deux.
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi

      # Construire et tester avant de mettre en ligne : une version publiee ne
      # se retire pas, elle se remplace par la suivante.
      - name: Construire
        if: steps.cible.outputs.publier == 'oui'
        working-directory: ${{ steps.cible.outputs.repertoire }}
        run: npm run build --if-present

      - name: Tester
        if: steps.cible.outputs.publier == 'oui'
        working-directory: ${{ steps.cible.outputs.repertoire }}
        run: npm test --if-present

      - name: Publier
        if: steps.cible.outputs.publier == 'oui'
        working-directory: ${{ steps.cible.outputs.repertoire }}
        # Sans --provenance : depot public + publication de confiance, npm
        # engendre l'attestation de lui-meme. Ajouter le drapeau ne changerait
        # rien et laisserait croire qu'il est ce qui la produit.
        run: npm publish

      - name: Resumer
        if: always()
        run: |
          set -eu
          {
            echo "## ${{ steps.cible.outputs.nom }} ${{ steps.cible.outputs.version }}"
            if [ "${{ steps.cible.outputs.publier }}" = "oui" ]; then
              echo "Publie depuis \`${{ steps.cible.outputs.repertoire }}/\` par jeton OIDC, sans jeton stocke."
            else
              echo "Deja en ligne : aucune publication."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
